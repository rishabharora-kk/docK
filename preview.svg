<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" role="img" aria-label="Animation: an icon is picked up, dragged two slots to the right while its neighbours slide left, then dropped with a small settle. It then travels back." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.a,.b,.c,.s{transform-box:fill-box;transform-origin:center;animation-duration:9s;animation-iteration-count:infinite}
.a{animation-name:A;animation-timing-function:ease-in-out}
.b{animation-name:B;animation-timing-function:cubic-bezier(.34,1.35,.64,1)}
.c{animation-name:C;animation-timing-function:cubic-bezier(.34,1.35,.64,1)}
.s{animation-name:S;animation-timing-function:cubic-bezier(.34,1.2,.64,1)}
@keyframes A{0%,4%{transform:translate(0,0) scale(1) rotate(0)}7%{transform:translate(0,0) scale(.92)}12%,16%{transform:translate(0,-6px) scale(1.14)}30%{transform:translate(128px,-6px) scale(1.14) rotate(5deg)}36%{transform:translate(128px,-6px) scale(1.14) rotate(0)}41%{transform:translate(132px,0) scale(1.02)}46%,54%{transform:translate(128px,0) scale(1)}58%{transform:translate(128px,-6px) scale(1.14)}72%{transform:translate(0,-6px) scale(1.14) rotate(-5deg)}78%{transform:translate(0,-6px) scale(1.14) rotate(0)}83%{transform:translate(-4px,0) scale(1.02)}88%,100%{transform:translate(0,0) scale(1)}}
@keyframes B{0%,22%{transform:translateX(0)}28%,68%{transform:translateX(-64px)}74%,100%{transform:translateX(0)}}
@keyframes C{0%,28%{transform:translateX(0)}34%,62%{transform:translateX(-64px)}68%,100%{transform:translateX(0)}}
@keyframes S{0%,8%{opacity:0;transform:translateX(0)}12%,20%{opacity:1;transform:translateX(0)}24%,26%{opacity:1;transform:translateX(64px)}30%,38%{opacity:1;transform:translateX(128px)}43%,56%{opacity:0;transform:translateX(128px)}58%,62%{opacity:1;transform:translateX(128px)}66%,68%{opacity:1;transform:translateX(64px)}72%,80%{opacity:1;transform:translateX(0)}86%,100%{opacity:0;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.a,.b,.c,.s{animation:none}}
</style>
<rect width="480" height="170" rx="24" fill="#26221e"/>
<rect x="106" y="62" width="268" height="76" rx="26" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/>
